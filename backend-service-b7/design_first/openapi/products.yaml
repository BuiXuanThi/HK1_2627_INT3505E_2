
openapi: 3.0.3

info:
  title: Product API - Design First
  version: 1.0.0

paths:
  /products:
    get:
      operationId: products.list_products
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      operationId: products.create_product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIn'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'


components:
  schemas:
    ProductIn:
      type: object
      required: [name, price]
      additionalProperties: false
      properties:
        name:
          type: string
        price:
          type: integer
          minimum: 0

    Product:
      type: object
      required: [id, name, price]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
          minimum: 0
